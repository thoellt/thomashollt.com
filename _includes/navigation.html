<!-- site header
================================================== -->
<header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}"><span class="dab c-terracotta" style="--r:-14deg"></span>{{ site.title }}</a>

    <nav class="site-nav" id="site-nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.url == "/publications/" %} aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url == "/cv/" %} aria-current="page"{% endif %}>CV</a>
        <a href="{{ '/contact/' | relative_url }}"{% if page.url == "/contact/" %} aria-current="page"{% endif %}>Contact</a>
    </nav>

    <button class="search-toggle" aria-label="Search" title="Search (⌘K / Ctrl K)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.2 15.4 C17 17.2 18.6 18.8 20 20.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <kbd class="search-key">⌘K</kbd>
    </button>
    <button class="theme-toggle" aria-label="Toggle evening mode" title="Day / evening">◐</button>
    <button class="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7.2 C9 6.6 15 7.6 20 6.9 M4 12.3 C9 11.8 14.5 12.8 20 12.1 M4 17.3 C8.5 16.8 15 17.8 20 17.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
</header> <!-- end site-header -->
