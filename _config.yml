title: Thomas Höllt
baseurl: ""
# search engines and link previews; a page can set its own description in its front matter
description: "Thomas Höllt, professor for visualization in the Vis Group at the University of Bergen, Norway. Visual analytics for large, high-dimensional data, single-cell and spatial omics."
# news list look: rules (hand-drawn line between entries) or strokes (a paint stroke behind each entry, like the publication list)
news_style: strokes
url: "https://www.thomashollt.com"
document_url: https://raw.githubusercontent.com/thoellt/publications/main/

mastodon: thomashollt
mastodoninstance: vis.social
github: thoellt
email: thomas.hollt@uib.no
# optional profile links, shown on the publications page when set
scholar: https://scholar.google.com/citations?user=7lsHJfkAAAAJ&hl=en
dblp: https://dblp.org/pid/48/5522.html

# author names (as written in the publication files) that are highlighted
me: [hollt, Thomas Höllt]

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
# only publications get their own pages; the other collections feed the CV, news and lists
collections:
  publications:
    output: true
    permalink: /publications/:path/
  profiles:
    output: false
  awards:
    output: false
  activities:
    output: false
  courses:
    output: false
  talks:
    output: false
  supervision:
    output: false
  news:
    output: false

exclude: [".git", ".github", ".gitignore", "Gemfile", "Gemfile.lock", "LICENSE", "README.md"]
plugins:
  - jekyll-redirect-from
